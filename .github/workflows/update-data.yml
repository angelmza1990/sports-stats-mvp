name: Update data

# Rebuilds every dataset twice a year:
#   July 1      - after the NBA Finals, the Champions League final, the European leagues, the Australian Open and Roland Garros
#   (Slams the ATP files don't cover yet are rebuilt from Wikipedia draw pages)
#   December 31 - after Wimbledon, the US Open, the ATP Finals, the Copa Libertadores final,
#                 the FIFA Intercontinental Cup, the Argentine Clausura, the Brasileirão, the Ballon d'Or and the F1 season
# A monthly keepalive stops GitHub from disabling the schedule
# (scheduled workflows in public repos are paused after 60 days without activity).

on:
  schedule:
    - cron: "0 9 1 7 *"
    - cron: "0 9 31 12 *"
    - cron: "0 9 15 * *" # keepalive
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  actions: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  keepalive:
    if: github.event.schedule == '0 9 15 * *'
    runs-on: ubuntu-latest
    steps:
      - name: Keep the scheduled workflow enabled
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/update-data.yml/enable"

  update:
    if: github.event.schedule != '0 9 15 * *'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Rebuild tennis (Big Three)
        id: tennis
        continue-on-error: true
        run: python3 scripts/build_big_three.py --refresh

      - name: Rebuild tennis (Grand Slams, men and women)
        id: slams
        continue-on-error: true
        run: python3 scripts/build_grand_slams.py --refresh

      - name: Rebuild tennis (Masters 1000 and WTA 1000)
        id: masters
        continue-on-error: true
        run: python3 scripts/build_masters.py --refresh

      - name: Rebuild basketball (NBA Rings)
        id: nba
        continue-on-error: true
        run: python3 scripts/build_nba_rings.py --refresh

      - name: Rebuild football (Libertadores, Champions League, world champions, Argentina, Ballon d'Or)
        id: football
        continue-on-error: true
        run: python3 scripts/build_football.py --refresh

      - name: Rebuild football (Serie A, La Liga, England, Ligue 1, Germany, Brasileirão)
        id: leagues
        continue-on-error: true
        run: python3 scripts/build_leagues.py --refresh

      - name: Rebuild football (FIFA World Cup)
        id: worldcup
        continue-on-error: true
        run: python3 scripts/build_world_cup.py --refresh

      - name: Rebuild motorsport (Formula 1)
        id: f1
        continue-on-error: true
        run: python3 scripts/build_f1.py --refresh

      # After the WTA 1000 build: the WTA records count WTA 1000 titles from it.
      - name: Rebuild tennis (ATP and WTA records)
        id: atp
        continue-on-error: true
        run: python3 scripts/build_atp_records.py --refresh

      - name: Rebuild swimming (Olympic medalists)
        id: swimming
        continue-on-error: true
        run: python3 scripts/build_swimming.py --refresh

      - name: Rebuild the Olympic Games
        id: olympics
        continue-on-error: true
        run: python3 scripts/build_olympics.py --refresh

      # After the Olympic Games: tennis takes each Games' host city from that dataset.
      - name: Rebuild Olympic tennis and boxing
        id: olysports
        continue-on-error: true
        run: python3 scripts/build_olympic_sports.py --refresh

      - name: Rebuild team tournaments (rugby, basketball, volleyball, hockey, handball, Olympic football)
        id: tournaments
        continue-on-error: true
        run: python3 scripts/build_tournaments.py --refresh

      # After the Grand Slams: the build checks its Open Era champions against theirs.
      - name: Rebuild tennis age records
        id: ages
        continue-on-error: true
        run: python3 scripts/build_tennis_ages.py --refresh

      - name: Rebuild ATP and WTA Finals
        id: tourfinals
        continue-on-error: true
        run: python3 scripts/build_tour_finals.py --refresh

      - name: Rebuild tennis world No. 1s
        id: numberone
        continue-on-error: true
        run: python3 scripts/build_number_ones.py --refresh

      - name: Rebuild chess
        id: chess
        continue-on-error: true
        run: python3 scripts/build_chess.py --refresh

      # Flags are served from assets/flags/; fetch any that a new nation needs.
      - name: Fetch new flags
        continue-on-error: true
        run: python3 scripts/fetch_flags.py

      - name: Commit and push changes
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # data/raw holds the snapshot of every source, so the data can be rebuilt if a source disappears.
          git add data/raw assets/flags tennis/big-three/data tennis/grand-slams/data tennis/grand-slams-women/data tennis/masters-1000/data tennis/wta-1000/data tennis/wta-records/data basketball/nba-rings/data football/copa-libertadores/data football/champions-league/data football/world-club-champions/data football/argentine-primera/data football/serie-a/data football/la-liga/data football/premier-league/data football/ligue-1/data football/bundesliga/data football/brasileirao/data football/world-cup/data football/ballon-dor/data motorsport/formula-1/data tennis/atp-records/data rugby/international/data basketball/international/data volleyball/international/data hockey/international/data handball/international/data swimming/olympics/data olympics/data tennis/olympics/data boxing/olympics/data football/olympics/data chess/data tennis/age-records/data tennis/number-one/data tennis/finals/data
          if git diff --cached --quiet; then
            echo "No data changes."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "Update data ($(date -u +%Y-%m-%d))"
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      # Pushes made with GITHUB_TOKEN don't trigger other workflows, so ask Pages to rebuild.
      - name: Rebuild GitHub Pages
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X POST "repos/${{ github.repository }}/pages/builds"

      - name: Report failed builds
        if: steps.tennis.outcome == 'failure' || steps.slams.outcome == 'failure' || steps.masters.outcome == 'failure' || steps.leagues.outcome == 'failure' || steps.nba.outcome == 'failure' || steps.football.outcome == 'failure' || steps.worldcup.outcome == 'failure' || steps.f1.outcome == 'failure' || steps.atp.outcome == 'failure' || steps.tournaments.outcome == 'failure' || steps.swimming.outcome == 'failure' || steps.olympics.outcome == 'failure' || steps.olysports.outcome == 'failure' || steps.chess.outcome == 'failure' || steps.ages.outcome == 'failure' || steps.numberone.outcome == 'failure' || steps.tourfinals.outcome == 'failure'
        run: |
          echo "::error::A data build failed validation (big three: ${{ steps.tennis.outcome }}, grand slams: ${{ steps.slams.outcome }}, masters: ${{ steps.masters.outcome }}, leagues: ${{ steps.leagues.outcome }}, nba: ${{ steps.nba.outcome }}, football: ${{ steps.football.outcome }}, world cup: ${{ steps.worldcup.outcome }}, f1: ${{ steps.f1.outcome }}, atp: ${{ steps.atp.outcome }}, tournaments: ${{ steps.tournaments.outcome }}, swimming: ${{ steps.swimming.outcome }}, olympics: ${{ steps.olympics.outcome }}, olympic tennis and boxing: ${{ steps.olysports.outcome }}, chess: ${{ steps.chess.outcome }}, tennis ages: ${{ steps.ages.outcome }}, world No. 1: ${{ steps.numberone.outcome }}, tour finals: ${{ steps.tourfinals.outcome }}). The previous data was kept; check the step logs."
          exit 1
