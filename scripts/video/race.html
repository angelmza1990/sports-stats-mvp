<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Race video frame</title>
<!-- Drawn frame by frame by scripts/make_race_video.mjs: window.setup(config), then window.frame(t) for each frame. -->
<style>
  :root {
    --bg: #0f1218;
    --panel: #171b23;
    --ink: #f3f5f8;
    --ink-2: #b9c0cc;
    --muted: #7d8696;
    --line: #2a303b;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1920px; height: 1080px; overflow: hidden; background: var(--bg); color: var(--ink);
    font-family: "Helvetica Neue", Helvetica, Arial, sans-serif; }
  header { position: absolute; left: 72px; top: 52px; right: 72px; }
  h1 { font-size: 54px; font-weight: 800; letter-spacing: -0.01em; }
  .subtitle { font-size: 26px; color: var(--ink-2); margin-top: 10px; }
  #chart { position: absolute; left: 72px; top: 200px; width: 1180px; height: 790px; }
  .bar-row { position: absolute; left: 0; height: 56px; width: 100%; will-change: transform; }
  .bar-name { position: absolute; left: 0; width: 300px; top: 0; height: 100%; display: flex; align-items: center;
    justify-content: flex-end; padding-right: 18px; font-size: 25px; font-weight: 600; white-space: nowrap; overflow: hidden; }
  .bar { position: absolute; left: 300px; top: 6px; height: 44px; border-radius: 0 6px 6px 0; }
  .bar-end { position: absolute; top: 0; height: 100%; display: flex; align-items: center; gap: 12px; }
  .bar-end img, .bar-end .badge { width: 46px; height: 46px; object-fit: contain; }
  .badge { border-radius: 50%; background: #2b3240; color: var(--ink-2); font-size: 15px; font-weight: 700;
    display: flex; align-items: center; justify-content: center; }
  .bar-value { font-size: 30px; font-weight: 800; font-variant-numeric: tabular-nums; }
  #panel { position: absolute; left: 1310px; top: 200px; width: 540px; height: 790px; }
  #big { font-size: 128px; font-weight: 900; line-height: 1; letter-spacing: -0.03em; color: var(--ink); font-variant-numeric: tabular-nums; }
  #tournament { font-size: 34px; font-weight: 700; margin-top: 14px; color: var(--ink); min-height: 82px; line-height: 1.2; }
  #era { display: inline-block; margin-top: 10px; font-size: 20px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase;
    color: var(--ink-2); border: 2px solid var(--line); border-radius: 999px; padding: 4px 14px; }
  [hidden] { display: none !important; }
  #champion { display: flex; align-items: center; gap: 22px; margin-top: 30px; padding: 22px; background: var(--panel);
    border-radius: 18px; min-height: 150px; }
  #champion img, #champion .badge { width: 104px; height: 104px; object-fit: contain; flex: none; }
  #champion .badge { font-size: 30px; }
  #champ-label { font-size: 18px; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted); }
  #champ-name { font-size: 38px; font-weight: 800; line-height: 1.1; margin-top: 4px; }
  #champ-note { font-size: 22px; color: var(--ink-2); margin-top: 8px; line-height: 1.25; }
  #recent-title { margin-top: 34px; font-size: 18px; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted); }
  #recent { margin-top: 10px; }
  .recent-row { display: flex; align-items: center; gap: 14px; padding: 9px 0; border-bottom: 1px solid var(--line); font-size: 23px; }
  .recent-row img, .recent-row .badge { width: 34px; height: 34px; object-fit: contain; flex: none; }
  .recent-row .badge { font-size: 12px; }
  .recent-row .when { color: var(--ink-2); width: 230px; flex: none; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .recent-row .who { font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  footer { position: absolute; left: 72px; right: 72px; bottom: 34px; display: flex; justify-content: space-between;
    font-size: 20px; color: var(--muted); }
  #counter { font-variant-numeric: tabular-nums; }

  /* Vertical (1080×1920, YouTube Shorts): year and champion on top, the race below, everything clear of the
     Shorts overlays (top bar, the buttons on the right, the caption at the bottom). */
  html.vertical, html.vertical body { width: 1080px; height: 1920px; }
  .vertical header { left: 64px; right: 64px; top: 120px; }
  .vertical h1 { font-size: 60px; line-height: 1.08; }
  .vertical .subtitle { font-size: 28px; line-height: 1.3; }
  .vertical #panel { left: 64px; top: 380px; width: 952px; height: 380px; }
  .vertical #big { font-size: 112px; }
  .vertical #tournament { font-size: 34px; min-height: 0; margin-top: 8px; }
  .vertical #champion { margin-top: 18px; min-height: 0; padding: 18px 22px; }
  .vertical #champion img, .vertical #champion .badge { width: 92px; height: 92px; }
  .vertical #champ-name { font-size: 40px; }
  .vertical #recent-title, .vertical #recent { display: none; }
  .vertical #chart { left: 40px; top: 830px; width: 920px; height: 640px; }
  .vertical .bar-name { width: 270px; font-size: 27px; text-overflow: ellipsis; display: block; line-height: 56px; text-align: right; }
  .vertical .bar { left: 270px; }
  .vertical footer { left: 64px; right: 64px; top: 1500px; bottom: auto; flex-direction: column; gap: 6px; font-size: 22px; }
</style>
</head>
<body>
  <header><h1 id="title"></h1><p class="subtitle" id="subtitle"></p></header>
  <div id="chart"></div>
  <aside id="panel">
    <div id="big"></div>
    <div id="tournament"></div>
    <div id="era" hidden></div>
    <div id="champion" hidden>
      <div id="champ-logo"></div>
      <div><div id="champ-label"></div><div id="champ-name"></div><div id="champ-note"></div></div>
    </div>
    <div id="recent-title"></div>
    <div id="recent"></div>
  </aside>
  <footer><span id="credit"></span><span id="counter"></span></footer>
<script>
"use strict";
const $ = (id) => document.getElementById(id);
const ease = (x) => (x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2);
let C, rows, states;
let TOP = 12, ROW = 790 / TOP, NAME_W = 300, BAR_MAX = 1180 - 300 - 150;

function logo(team, cls) {
  if (team.logo) {
    const img = new Image();
    img.src = team.logo;
    if (cls) img.className = cls;
    img.onerror = () => img.replaceWith(badge(team));
    return img;
  }
  return badge(team);
}
function badge(team) {
  const b = document.createElement("div");
  b.className = "badge";
  b.textContent = team.name.replace(/[^A-Za-zÀ-ÿ ]/g, "").split(/\s+/).filter(Boolean).slice(0, 2).map((w) => w[0]).join("").toUpperCase();
  return b;
}

// The standings before each event (an event adds one title, or e.add, such as weeks at No. 1): counts, and when each team reached its count (earlier ranks first on ties).
function buildStates() {
  const count = {}, reached = {};
  const out = [];
  const snap = () => {
    const order = Object.keys(count).sort((a, b) => count[b] - count[a] || reached[a] - reached[b]);
    out.push({ count: { ...count }, rank: Object.fromEntries(order.map((id, i) => [id, i])) });
  };
  snap();
  C.events.forEach((e, i) => {
    count[e.winner] = (count[e.winner] || 0) + (e.add ?? 1);
    reached[e.winner] = i;
    snap();
  });
  return out;
}

window.setup = async (config) => {
  C = config;
  if (C.vertical) {
    document.documentElement.classList.add("vertical");
    TOP = 10; ROW = 640 / TOP; NAME_W = 270; BAR_MAX = 470;
  }
  $("title").textContent = C.title;
  $("subtitle").textContent = C.subtitle;
  $("credit").textContent = C.credit;
  $("recent-title").textContent = C.text.recent;
  $("champ-label").textContent = C.text.champion;
  states = buildStates();
  rows = {};
  for (const [id, team] of Object.entries(C.teams)) {
    const row = document.createElement("div");
    row.className = "bar-row";
    row.innerHTML = `<div class="bar-name"></div><div class="bar"></div><div class="bar-end"><span class="bar-value"></span></div>`;
    row.querySelector(".bar-name").textContent = team.name;
    row.querySelector(".bar").style.background = team.color;
    row.querySelector(".bar-end").prepend(logo(team));
    $("chart").append(row);
    rows[id] = row;
  }
  // Every logo loaded (or failed) before the first frame.
  await Promise.all([...document.images].map((img) => (img.complete ? null : new Promise((r) => { img.onload = r; img.addEventListener("error", r); }))));
};

let shownEvent = -2;
window.frame = async (t) => {
  const n = C.events.length;
  const k = Math.min(Math.floor(t), n - 1);
  const raw = t >= n ? 1 : t - k;
  const p = ease(Math.min(1, raw / 0.7)); // move during the first 70% of each step, then hold
  const before = states[k], after = states[k + 1];
  const value = (id) => (before.count[id] || 0) + ((after.count[id] || 0) - (before.count[id] || 0)) * p;
  const pos = (s, id) => (id in s.rank ? s.rank[id] : TOP + 1);
  const max = Math.max(1, ...Object.keys(after.count).map(value));
  for (const [id, row] of Object.entries(rows)) {
    const r = pos(before, id) + (pos(after, id) - pos(before, id)) * p;
    const v = value(id);
    row.style.transform = `translateY(${r * ROW}px)`;
    row.style.opacity = v > 0 ? Math.max(0, Math.min(1, TOP - r)) : 0;
    const w = (v / max) * BAR_MAX;
    row.querySelector(".bar").style.width = `${w}px`;
    row.querySelector(".bar-end").style.left = `${NAME_W + w + 14}px`;
    row.querySelector(".bar-value").textContent = String(Math.round(v));
  }
  // The panel: the event being awarded, and the latest champions before it.
  const ev = t < 0 ? -1 : k;
  if (ev !== shownEvent) {
    shownEvent = ev;
    const e = C.events[ev];
    $("big").textContent = e ? e.big : C.text.start;
    $("tournament").textContent = e ? e.name : C.text.startNote;
    $("era").hidden = !(e && e.tag);
    if (e && e.tag) $("era").textContent = e.tag;
    $("champion").hidden = !e;
    if (e) {
      $("champ-logo").replaceChildren(logo(C.teams[e.winner]));
      $("champ-name").textContent = e.winnerName || C.teams[e.winner].name;
      $("champ-note").textContent = e.note || "";
    }
    const recent = C.events.slice(Math.max(0, ev - 5), Math.max(0, ev)).reverse();
    $("recent").replaceChildren(...recent.map((r) => {
      const row = document.createElement("div");
      row.className = "recent-row";
      const when = document.createElement("span"); when.className = "when"; when.textContent = r.short;
      const who = document.createElement("span"); who.className = "who"; who.textContent = C.teams[r.winner].name;
      row.append(when, logo(C.teams[r.winner]), who);
      return row;
    }));
    $("counter").textContent = e && C.text.unit ? `${ev + 1} / ${n} ${C.text.unit}` : "";
    // New logos in the panel: decoded before the frame is captured.
    await Promise.all([...document.images].map((img) => img.decode().catch(() => null)));
  }
};
</script>
</body>
</html>
